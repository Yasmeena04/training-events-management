<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Levent</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Shared stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body class="auth-page">

    <main class="auth-layout">

        <!-- Levent Logo -->
        <a href="index.html" class="auth-logo">
            <img
                src="assets/img/logo-2.png"
                alt="Levent - Learn, Connect, Grow"
            >
        </a>


        <!-- Login Card -->
        <section class="auth-card">

            <div class="auth-card-header">

                <p class="auth-eyebrow">WELCOME BACK</p>

                <h1>Log in to Levent</h1>

                <p>
                    Continue discovering training opportunities.
                </p>

            </div>


            <!-- Social Login -->
            <div class="social-login">

                <button type="button" class="social-button">
                    <span class="google-mark">G</span>
                    Google
                </button>

                <button type="button" class="social-button">
                    <span class="facebook-mark">f</span>
                    Facebook
                </button>

                <button type="button" class="social-button">
                    <span class="microsoft-mark" aria-hidden="true">
                        <i></i><i></i><i></i><i></i>
                    </span>
                    Microsoft
                </button>

            </div>


            <!-- Divider -->
            <div class="auth-divider">
                <span>OR CONTINUE WITH EMAIL</span>
            </div>


            <!-- Login Fields (checked by the browser: HTML5 validation) -->
            <form class="auth-fields" action="participant/trainings.html" method="get">

                <div class="auth-field">

                    <label for="login-email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        pattern="[^@\s]+@[^@\s]+\.[^@\s]+"
                        title="Enter a valid email, for example name@example.com"
                        aria-describedby="login-email-hint"
                        required
                    >

                    <small class="field-hint" id="login-email-hint">Enter a valid email, for example name@example.com</small>

                </div>


                <div class="auth-field">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        minlength="8"
                        title="Your password has at least 8 characters"
                        aria-describedby="login-password-hint"
                        required
                    >

                    <small class="field-hint" id="login-password-hint">At least 8 characters</small>

                </div>


                <div class="auth-options">

                    <label class="remember-option">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="login.html" class="forgot-link">
                        Forgot password?
                    </a>

                </div>


                <button type="submit" class="auth-submit">
                    Log in
                </button>

            </form>


            <!-- Register Link -->
            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

        </section>

        <p class="auth-legal">
            Learn. Connect. Grow.
        </p>




    </main>

</body>
</html>
