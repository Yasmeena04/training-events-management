<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments | Training Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- Owner: Shora | Module 5: Payments (manager) -->
  <header class="app-header text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="../index.html" class="text-decoration-none">
        <img src="../assets/img/logo.png" alt="Levent" class="brand-logo">
      </a>
      <nav class="app-nav d-none d-md-flex align-items-center gap-4">
        <a href="requests.html">Requests</a>
        <a href="schedule.html">Schedule</a>
        <a href="payments.html" class="active">Payments</a>
        <a href="reports.html">Reports</a>
      </nav>
      <div class="d-flex align-items-center gap-3">
        <select class="form-select role-select" aria-label="Role">
          <option value="participant">Participant</option>
          <option value="trainer">Trainer</option>
          <option value="manager" selected>Manager</option>
        </select>
        <a href="#" class="bell-btn" aria-label="Notifications">🔔<span class="dot"></span></a>
        <div class="user-pill">
          <div class="user-avatar" id="user-initials">TM</div>
          <span id="user-name">Training Manager</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>Payments</h1>
      <p class="muted">All participant payments and refunds.</p>
    </div>

    <div class="grid-4" id="stats"></div>

    <div class="table-wrap">
      <table class="table mb-0 align-middle">
        <thead>
          <tr><th>Participant</th><th>Training</th><th>Amount</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="payments-body"></tbody>
      </table>
    </div>
  </main>

  <footer class="app-footer py-4 mt-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
      <div class="d-flex align-items-center gap-3">
        <img src="../assets/img/logo.png" alt="Levent" class="brand-logo">
        <div class="footer-sub">Training Events Management System</div>
      </div>
      <p class="footer-tagline mb-0">A single place to discover, manage and complete training.</p>
    </div>
  </footer>

  <script>
    var payments = [
      { name: "Sara Ahmed",  training: "Web Development Fundamentals", amount: 150, status: "Paid" },
      { name: "Omar Khaled", training: "Machine Learning Bootcamp",    amount: 200, status: "Paid" },
      { name: "Salem Reda",  training: "Web Development Fundamentals", amount: 150, status: "Refunded" },
      { name: "Mona Saad",   training: "Machine Learning Bootcamp",    amount: 200, status: "Awaiting payment" }
    ];
    var tagOf = { "Paid": "ok", "Refunded": "bad", "Awaiting payment": "warn" };

    function count(s) { return payments.filter(function (p) { return p.status === s; }).length; }

    function render() {
      var total = 0;
      payments.forEach(function (p) { if (p.status === "Paid") total += p.amount; });

      var stats = [["Total collected", total + " LYD"], ["Paid", count("Paid")],
                   ["Refunded", count("Refunded")], ["Awaiting payment", count("Awaiting payment")]];
      document.getElementById("stats").innerHTML = stats.map(function (s) {
        return '<div class="card"><p class="muted small mb-1">' + s[0] + '</p><h2 class="mb-0">' + s[1] + '</h2></div>';
      }).join("");

      document.getElementById("payments-body").innerHTML = payments.map(function (p, i) {
        var btn = p.status === "Paid"
          ? '<button class="btn btn-soft btn-sm" onclick="refund(' + i + ')">Refund</button>' : "";
        return '<tr><td>' + p.name + '</td><td>' + p.training + '</td><td>' + p.amount + ' LYD</td>' +
               '<td><span class="tag ' + tagOf[p.status] + '">' + p.status + '</span></td>' +
               '<td class="text-end">' + btn + '</td></tr>';
      }).join("");
    }

    function refund(i) {
      if (confirm("Refund " + payments[i].amount + " LYD to " + payments[i].name + "?")) {
        payments[i].status = "Refunded";
        render();
      }
    }

    render();
  </script>
</body>
</html>
