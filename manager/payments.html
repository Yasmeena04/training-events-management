<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments | Training Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- Owner: Shora | Module 5: Payments (manager) -->
  <!-- Header (same layout as the homepage) -->
  <header class="site-header">
    <a href="../index.html" class="brand">
      <img src="../assets/img/logo.png" alt="Levent — Learn, Connect, Grow" class="brand-logo">
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="../manager/requests.html">Requests</a>
      <a href="../manager/schedule.html">Schedule</a>
      <a href="../manager/payments.html" class="active" aria-current="page">Payments</a>
      <a href="../manager/announcements.html">Announcements</a>
    </nav>
    <div class="header-tools">
      <label for="role-switch" class="visually-hidden">Switch role</label>
      <select id="role-switch" class="form-select role-select" onchange="location.href = this.value">
        <option value="../participant/trainings.html">Participant</option>
        <option value="../trainer/my-trainings.html">Trainer</option>
        <option value="../manager/requests.html" selected>Manager</option>
        <option value="../admin/dashboard.html">Admin</option>
      </select>
      <a href="../alerts.html" class="bell" aria-label="Alerts">&#128276;<i></i></a>
      <a href="../profile.html" class="user-chip"><span class="avatar">TM</span><span>Training Manager</span></a>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>Payments</h1>
      <p class="muted">All participant payments and refunds.</p>
    </div>

    <div class="grid-4" id="stats"></div>

    <div class="table-wrap">
      <table class="table mb-0 align-middle">
        <thead>
          <tr><th>Participant</th><th>Training</th><th>Amount</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="payments-body"></tbody>
      </table>
    </div>
  </main>

  <!-- Footer (same layout as the homepage) -->
  <footer class="site-footer">
    <div class="footer-brand">
      <a href="../index.html" class="brand">
        <img src="../assets/img/logo.png" alt="Levent" class="brand-logo">
      </a>
      <p>LEARN · CONNECT · GROW</p>
    </div>
    <p>&copy; 2026 Training Events. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var payments = [
      { name: "Sara Ahmed",  training: "Web Development Fundamentals", amount: 150, status: "Paid" },
      { name: "Omar Khaled", training: "Machine Learning Bootcamp",    amount: 200, status: "Paid" },
      { name: "Salem Reda",  training: "Web Development Fundamentals", amount: 150, status: "Refunded" },
      { name: "Mona Saad",   training: "Machine Learning Bootcamp",    amount: 200, status: "Awaiting payment" }
    ];
    var tagOf = { "Paid": "ok", "Refunded": "bad", "Awaiting payment": "warn" };

    function count(s) { return payments.filter(function (p) { return p.status === s; }).length; }

    function render() {
      var total = 0;
      payments.forEach(function (p) { if (p.status === "Paid") total += p.amount; });

      var stats = [["Total collected", total + " LYD"], ["Paid", count("Paid")],
                   ["Refunded", count("Refunded")], ["Awaiting payment", count("Awaiting payment")]];
      document.getElementById("stats").innerHTML = stats.map(function (s) {
        return '<div class="card"><p class="muted small mb-1">' + s[0] + '</p><h2 class="mb-0">' + s[1] + '</h2></div>';
      }).join("");

      document.getElementById("payments-body").innerHTML = payments.map(function (p, i) {
        var btn = p.status === "Paid"
          ? '<button class="btn btn-soft btn-sm" onclick="refund(' + i + ')">Refund</button>' : "";
        return '<tr><td>' + p.name + '</td><td>' + p.training + '</td><td>' + p.amount + ' LYD</td>' +
               '<td><span class="tag ' + tagOf[p.status] + '">' + p.status + '</span></td>' +
               '<td class="text-end">' + btn + '</td></tr>';
      }).join("");
    }

    function refund(i) {
      if (confirm("Refund " + payments[i].amount + " LYD to " + payments[i].name + "?")) {
        payments[i].status = "Refunded";
        render();
      }
    }

    render();
  </script>
</body>
</html>
