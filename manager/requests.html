<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training requests · Training Events</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-role="manager" data-page="requests">
<div id="site-header"></div>
<main class="container">
<div class="page-head"><p class="eyebrow">Manager</p><h1>Training requests</h1></div>
<div class="grid-4"><div class="stat"><span>Pending review</span><strong id="s-pending">0</strong></div><div class="stat"><span>Changes requested</span><strong id="s-changes">0</strong></div>
<div class="stat"><span>Published trainings</span><strong id="s-published">0</strong></div><div class="stat"><span>Starting this week</span><strong id="s-week">0</strong></div></div>
<div class="layout-2"><div class="table-wrap"><table class="table align-middle mb-0"><thead><tr><th>Training</th><th>Trainer</th><th>Type</th><th>Sent</th><th>Status</th></tr></thead><tbody id="req-rows"></tbody></table></div>
<aside class="card side" id="review-panel" aria-live="polite"></aside></div>
</main>
<div id="site-footer"></div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/scheduling.js"></script>
<script src="../assets/js/requests.js"></script>
</body>
</html>
