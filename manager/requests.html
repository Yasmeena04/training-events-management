<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training requests · Training Events</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-role="manager" data-page="requests">
  <!-- Header (same layout as the homepage) -->
  <header class="site-header">
    <a href="../index.html" class="brand">
      <img src="../assets/img/logo.png" alt="Levent — Learn, Connect, Grow" class="brand-logo">
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="../manager/requests.html" class="active" aria-current="page">Requests</a>
      <a href="../manager/schedule.html">Schedule</a>
      <a href="../manager/payments.html">Payments</a>
      <a href="../manager/announcements.html">Announcements</a>
    </nav>
    <div class="header-tools">
      <label for="role-switch" class="visually-hidden">Switch role</label>
      <select id="role-switch" class="form-select role-select" onchange="location.href = this.value">
        <option value="../participant/trainings.html">Participant</option>
        <option value="../trainer/my-trainings.html">Trainer</option>
        <option value="../manager/requests.html" selected>Manager</option>
        <option value="../admin/dashboard.html">Admin</option>
      </select>
      <a href="../alerts.html" class="bell" aria-label="Alerts">&#128276;<i></i></a>
      <a href="../profile.html" class="user-chip"><span class="avatar">TM</span><span>Training Manager</span></a>
    </div>
  </header>
<main class="container">
<div class="page-head"><p class="eyebrow">Manager</p><h1>Training requests</h1></div>
<div class="grid-4"><div class="stat"><span>Pending review</span><strong id="s-pending">0</strong></div><div class="stat"><span>Changes requested</span><strong id="s-changes">0</strong></div>
<div class="stat"><span>Published trainings</span><strong id="s-published">0</strong></div><div class="stat"><span>Starting this week</span><strong id="s-week">0</strong></div></div>
<div class="layout-2"><div class="table-wrap"><table class="table align-middle mb-0"><thead><tr><th>Training</th><th>Trainer</th><th>Type</th><th>Sent</th><th>Status</th></tr></thead><tbody id="req-rows"></tbody></table></div>
<aside class="card side" id="review-panel" aria-live="polite"></aside></div>
</main>
  <!-- Footer (same layout as the homepage) -->
  <footer class="site-footer">
    <div class="footer-brand">
      <a href="../index.html" class="brand">
        <img src="../assets/img/logo.png" alt="Levent" class="brand-logo">
      </a>
      <p>LEARN · CONNECT · GROW</p>
    </div>
    <p>&copy; 2026 Training Events. All rights reserved.</p>
  </footer>
</body>
</html>
