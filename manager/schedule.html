<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule · Training Events</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-role="manager" data-page="schedule">
<div id="site-header"></div>
<main class="container">
<div class="page-head"><p class="eyebrow">Manager</p><h1>Schedule</h1><p class="muted">Create sessions, assign a room and publish. The system blocks room and time clashes.</p></div>
<div class="layout-2"><div><div class="card" style="margin-bottom:1.25rem"><div class="field"><label class="lbl" for="training-pick">Training</label><select class="form-select" id="training-pick"></select><p class="small muted" id="train-info" style="margin-top:.4rem"></p></div>
<h3>Sessions</h3><div class="table-wrap"><table class="table align-middle mb-0"><thead><tr><th class="num">#</th><th>Date</th><th>Time</th><th>Room</th></tr></thead><tbody id="session-rows"></tbody></table></div></div>
<h2>Room timetable</h2><div class="table-wrap"><table class="table align-middle mb-0"><thead><tr><th>Date</th><th>Time</th><th>Room</th><th>Training</th></tr></thead><tbody id="timetable-rows"></tbody></table></div></div>
<aside class="card side"><h3>Assign room</h3><div class="field"><label class="lbl" for="room-pick">Room</label><select class="form-select" id="room-pick"></select></div>
<div id="clash-box" class="notice"></div><button class="btn btn-primary w-100" id="save-schedule">Save schedule and publish</button></aside></div>
</main>
<div id="site-footer"></div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/scheduling.js"></script>
</body>
</html>
