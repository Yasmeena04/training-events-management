<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a training | Training Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- Owner: Shora | Module 4 -->
  <div id="site-header"></div>
  <section class="bg-light py-4">
  <div class="container">
    <h1>Find a training</h1>
    <p class="text-muted">Workshops, courses and internships that are open for registration.</p>

    <form id="search-form" class="row g-2 mt-3">
      <div class="col">
        <input type="text" id="search-input" class="form-control" placeholder="Search by title, topic or trainer">
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-dark">Search</button>
      </div>
    </form>
  </div>
</section>

<main class="container py-4">
  <div class="row g-4">
      <div class="col-lg-3">
      <div class="card">
  <div class="card-body">
    <h2 class="h5">Filters</h2>

    <p class="fw-semibold mb-2">Type</p>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="type-workshop" checked>
      <label class="form-check-label" for="type-workshop">Workshop</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="type-course" checked>
      <label class="form-check-label" for="type-course">Course</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="type-internship" checked>
      <label class="form-check-label" for="type-internship">Internship</label>
      </div>
      <label for="category" class="form-label fw-semibold mt-3">Category</label>
      <select id="category" class="form-select">
        <option value="all">All categories</option>
        <option value="programming">Programming</option>
        <option value="data">Data</option>
        <option value="design">Design</option>
        <option value="communication">Communication</option>
     </select>
     <label for="start-date" class="form-label fw-semibold mt-3">Starts after</label>
     <input type="date" id="start-date" class="form-control">
     <p class="fw-semibold mt-3 mb-2">Price</p>

<div class="form-check">
  <input class="form-check-input" type="radio" name="price" id="price-all" value="all" checked>
  <label class="form-check-label" for="price-all">All</label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="price" id="price-free" value="free">
  <label class="form-check-label" for="price-free">Free</label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="price" id="price-paid" value="paid">
  <label class="form-check-label" for="price-paid">Paid</label>
</div>

<div class="d-flex align-items-center gap-3 mt-4">
  <button type="button" id="apply-filters" class="btn btn-dark">Apply filters</button>
  <a href="#" id="clear-filters">Clear</a>
</div>

    </div>
  </div>
</div>
    </div>
    <div class="col-lg-9">
      <p>Results go here</p>
    </div>
  </div>
</main>

  <div id="site-footer"></div>


</body>
</html>
