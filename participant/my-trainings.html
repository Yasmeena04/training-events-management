<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Trainings | Training Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- Owner: Shora | Module 4 -->
  <!-- Header -->
  <header class="app-header text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="../index.html" class="text-decoration-none">
        <img src="../assets/img/logo.png" alt="Levent" class="brand-logo">
      </a>
      <nav class="app-nav d-none d-md-flex align-items-center gap-4">
        <a href="trainings.html">Discover</a>
        <a href="my-trainings.html" class="active">My trainings</a>
        <a href="certificate.html">Certificates</a>
      </nav>
      <div class="d-flex align-items-center gap-3">
        <select class="form-select role-select" aria-label="Role">
          <option value="participant">Participant</option>
          <option value="trainer">Trainer</option>
          <option value="manager">Manager</option>
        </select>
        <a href="#" class="bell-btn" aria-label="Notifications">🔔<span class="dot"></span></a>
        <div class="user-pill">
          <div class="user-avatar" id="user-initials">G2</div>
          <span id="user-name">Group 2</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container py-5">
    <div class="mb-4">
      <h1 class="fw-bold mb-1">My trainings</h1>
      <p class="text-muted">Track your applications, payments, attendance and certificates.</p>
    </div>

    <h2 class="h5 fw-bold mb-3" id="active-title"></h2>
    <div class="d-flex flex-column gap-3 mb-5" id="active-list"></div>

    <h2 class="h5 fw-bold mb-3" id="done-title"></h2>
    <div class="d-flex flex-column gap-3" id="done-list"></div>
  </main>

  <!-- Footer -->
  <footer class="app-footer py-4 mt-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
      <div class="d-flex align-items-center gap-3">
        <img src="../assets/img/logo.png" alt="Levent" class="brand-logo">
        <div class="footer-sub">Training Events Management System</div>
      </div>
      <p class="footer-tagline mb-0">A single place to discover, manage and complete training.</p>
    </div>
  </footer>

  <script>
    // Header user pill
    (function () {
      var name = localStorage.getItem("userName") || "Group 2";
      var initials = name.trim().split(/\s+/).slice(0, 2)
        .map(function (w) { return w.charAt(0).toUpperCase(); }).join("");
      document.getElementById("user-name").textContent = name;
      document.getElementById("user-initials").textContent = initials;
    })();

    var active = [
      { id: "web-dev",    title: "Web Development Fundamentals", info: "Course · 150 LYD", status: "Awaiting payment", note: "Accepted by the trainer on 3 Nov. Pay by 15 Nov to keep your seat." },
      { id: "summer",     title: "Summer Internship: Software Engineering", info: "Internship · Free", status: "Under review", note: "The trainer is reviewing your application, sent on 20 Oct." },
      { id: "intro-data", title: "Intro to Data Analysis", info: "Workshop · Free", status: "Confirmed", note: "Thu 12 Nov · 9:00 – 15:00 · Room B2" },
      { id: "int-to-ai",  title: "Machine Learning Bootcamp", info: "Course · 200 LYD", status: "Waitlisted", note: "The course is full. You are on the waitlist." },
      { id: "cyber",      title: "Cybersecurity Awareness", info: "Workshop · Free", status: "Declined", note: "The trainer declined your application." }
    ];

    var done = [
      { title: "Excel for Beginners", info: "Workshop", status: "Completed", attended: 3, total: 3, note: "Certificate issued on 17 Oct." },
      { title: "Teamwork and Communication", info: "Workshop", status: "Not completed", attended: 1, total: 2, note: "The minimum for a certificate was 80% attendance." }
    ];

    var tagOf = { "Awaiting payment": "warn", "Under review": "", "Confirmed": "ok",
                  "Waitlisted": "warn", "Declined": "bad", "Withdrawn": "bad" };

    function buttons(t, i) {
      var html = "";
      if (t.status === "Awaiting payment")
        html += '<a href="payment.html?id=' + t.id + '" class="btn btn-primary">Pay now</a>';
      if (t.status !== "Awaiting payment" && t.status !== "Withdrawn")
        html += '<a href="training-details.html?id=' + t.id + '" class="btn btn-soft">View details</a>';
      if (t.status !== "Declined" && t.status !== "Withdrawn")
        html += '<button class="btn btn-outline-secondary" onclick="withdraw(' + i + ')">Withdraw</button>';
      return html;
    }

    function render() {
      document.getElementById("active-title").textContent = "Active (" + active.length + ")";
      document.getElementById("active-list").innerHTML = active.map(function (t, i) {
        return '<div class="card"><div class="row align-items-center gy-3">' +
          '<div class="col-lg-8">' +
            '<div class="d-flex align-items-center flex-wrap gap-2 mb-2"><h3 class="h6 fw-bold mb-0">' + t.title + '</h3>' +
            '<span class="tag">' + t.info + '</span></div>' +
            '<span class="tag ' + tagOf[t.status] + ' me-2">' + t.status + '</span>' +
            '<span class="small text-muted">' + t.note + '</span>' +
          '</div>' +
          '<div class="col-lg-4"><div class="d-flex justify-content-lg-end gap-2">' + buttons(t, i) + '</div></div>' +
          '</div></div>';
      }).join("");

      document.getElementById("done-title").textContent = "Completed (" + done.length + ")";
      document.getElementById("done-list").innerHTML = done.map(function (t) {
        var pct = Math.round(t.attended / t.total * 100);
        var ok = t.status === "Completed";
        return '<div class="card"><div class="row align-items-center gy-3">' +
          '<div class="col-lg-8">' +
            '<div class="d-flex align-items-center flex-wrap gap-2 mb-2"><h3 class="h6 fw-bold mb-0">' + t.title + '</h3>' +
            '<span class="tag">' + t.info + '</span><span class="tag ' + (ok ? "ok" : "bad") + '">' + t.status + '</span></div>' +
            '<div class="d-flex justify-content-between small text-muted mb-1"><span>Attendance</span>' +
            '<strong class="text-dark">' + t.attended + ' of ' + t.total + ' sessions (' + pct + '%)</strong></div>' +
            '<div class="progress mb-2" style="height:6px"><div class="progress-bar" style="width:' + pct + '%;background:' + (ok ? "var(--brand)" : "#6c757d") + '"></div></div>' +
            '<p class="small text-muted mb-0">' + t.note + '</p>' +
          '</div>' +
          '<div class="col-lg-4"><div class="d-flex justify-content-lg-end gap-2">' +
            (ok ? '<a href="certificate.html" class="btn btn-primary">Download certificate</a>' +
                  '<button class="btn btn-outline-secondary" onclick="window.print()">Print</button>'
                : '<button class="btn btn-soft" disabled>No certificate</button>') +
          '</div></div></div></div>';
      }).join("");
    }

    function withdraw(i) {
      if (confirm("Withdraw from " + active[i].title + "?")) {
        active[i].status = "Withdrawn";
        active[i].note = "You withdrew from this training.";
        render();
      }
    }

    render();
  </script>
</body>
</html>
