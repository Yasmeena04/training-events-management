<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment | Training Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- Owner: Shora | Module 5: Payments (participant) -->
  <!-- Header (same layout as the homepage) -->
  <header class="site-header">
    <a href="../index.html" class="brand">
      <img src="../assets/img/logo.png" alt="Levent — Learn, Connect, Grow" class="brand-logo">
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="../participant/trainings.html">Discover</a>
      <a href="../participant/my-trainings.html" class="active">My trainings</a>
      <a href="../participant/certificate.html">Certificates</a>
    </nav>
    <div class="header-tools">
      <label for="role-switch" class="visually-hidden">Switch role</label>
      <select id="role-switch" class="form-select role-select" onchange="location.href = this.value">
        <option value="../participant/trainings.html" selected>Participant</option>
        <option value="../trainer/my-trainings.html">Trainer</option>
        <option value="../manager/requests.html">Manager</option>
        <option value="../admin/dashboard.html">Admin</option>
      </select>
      <a href="../alerts.html" class="bell" aria-label="Alerts">&#128276;<i></i></a>
      <a href="../profile.html" class="user-chip"><span class="avatar" id="user-initials">G2</span><span id="user-name">Group 2</span></a>
    </div>
  </header>

  <main class="container py-4">
    <div class="page-head">
      <h1>Complete your payment</h1>
      <p class="muted">Demo only: payments are verified automatically and no real charge is made.</p>
    </div>

    <div class="layout-2">
      <div class="card">
        <h2 class="mb-3">Payment method</h2>
        <form id="payment-form" novalidate>
          <div class="field">
            <label class="lbl" for="card-name">Cardholder name</label>
            <input type="text" class="form-control" id="card-name" required>
          </div>
          <div class="field">
            <label class="lbl" for="card-number">Card number</label>
            <input type="text" class="form-control" id="card-number" placeholder="1234 5678 9012 3456" maxlength="19" required>
          </div>
          <div class="cols">
            <div class="field">
              <label class="lbl" for="card-expiry">Expiry</label>
              <input type="text" class="form-control" id="card-expiry" placeholder="MM/YY" maxlength="5" required>
            </div>
            <div class="field">
              <label class="lbl" for="card-cvv">CVV</label>
              <input type="password" class="form-control" id="card-cvv" placeholder="***" maxlength="4" required>
            </div>
          </div>
          <div id="message" class="small mt-2"></div>
          <div class="actions">
            <a href="my-trainings.html" class="btn btn-soft">Cancel</a>
            <button type="submit" class="btn btn-primary" id="pay-btn">Pay</button>
          </div>
        </form>
      </div>

      <div class="card side">
        <h3 class="mb-3">Order summary</h3>
        <span class="tag mb-2" id="s-type"></span>
        <h2 id="s-title"></h2>
        <p class="muted small" id="s-trainer"></p>
        <dl class="kv">
          <dt>Duration</dt><dd id="s-duration"></dd>
          <dt>Sessions</dt><dd id="s-sessions"></dd>
        </dl>
        <hr>
        <div class="d-flex justify-content-between align-items-center">
          <strong>Total</strong>
          <strong class="h4 mb-0" id="s-price"></strong>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer (same layout as the homepage) -->
  <footer class="site-footer">
    <div class="footer-brand">
      <a href="../index.html" class="brand">
        <img src="../assets/img/logo.png" alt="Levent" class="brand-logo">
      </a>
      <p>LEARN · CONNECT · GROW</p>
    </div>
    <p>&copy; 2026 Training Events. All rights reserved.</p>
  </footer>

  <script>
    // Header user pill
    var userName = localStorage.getItem("userName") || "Shora Waeil";
    document.getElementById("user-name").textContent = userName;
    document.getElementById("user-initials").textContent = userName.trim().split(/\s+/).slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); }).join("");
    document.getElementById("card-name").value = userName;

    var trainings = {
      "web-dev":   { title: "Web Development Fundamentals", price: "150 LYD", trainer: "Code Academy", type: "Course",   duration: "4 weeks", sessions: "8 sessions" },
      "int-to-ai": { title: "Machine Learning Bootcamp",    price: "200 LYD", trainer: "Data Lab",     type: "Course",   duration: "2 weeks", sessions: "10 sessions" },
      "ui-ux":     { title: "UI/UX Design Basics",          price: "50 LYD",  trainer: "Omar K.",      type: "Workshop", duration: "3 days",  sessions: "3 sessions" }
    };

    var t = trainings[new URLSearchParams(location.search).get("id")] || trainings["web-dev"];
    document.getElementById("s-title").textContent    = t.title;
    document.getElementById("s-trainer").textContent  = "By " + t.trainer;
    document.getElementById("s-type").textContent     = t.type;
    document.getElementById("s-duration").textContent = t.duration;
    document.getElementById("s-sessions").textContent = t.sessions;
    document.getElementById("s-price").textContent    = t.price;
    document.getElementById("pay-btn").textContent    = "Pay " + t.price;

    document.getElementById("payment-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var msg = document.getElementById("message");
      var number = document.getElementById("card-number").value.replace(/\s/g, "");
      var expiry = document.getElementById("card-expiry").value;
      var cvv = document.getElementById("card-cvv").value;

      if (!document.getElementById("card-name").value.trim() ||
          !/^\d{16}$/.test(number) || !/^\d{2}\/\d{2}$/.test(expiry) || !/^\d{3,4}$/.test(cvv)) {
        msg.className = "small mt-2 text-danger";
        msg.textContent = "Please check your card details.";
        return;
      }

      var btn = document.getElementById("pay-btn");
      btn.disabled = true;
      btn.textContent = "Verifying...";
      setTimeout(function () {
        msg.className = "small mt-2 text-success";
        msg.textContent = "Payment verified. Your seat is confirmed.";
        setTimeout(function () { location.href = "my-trainings.html"; }, 1200);
      }, 1500);
    });
  </script>
</body>
</html>
