<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Applications | Training Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-role="trainer" data-page="applications">

  <!-- Owner: Shora | Module 4 -->
  <!-- Header (same layout as the homepage) -->
  <header class="site-header">
    <a href="../index.html" class="brand">
      <img src="../assets/img/logo.png" alt="Levent — Learn, Connect, Grow" class="brand-logo">
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="../trainer/my-trainings.html">My trainings</a>
      <a href="../trainer/new-request.html">New request</a>
      <a href="../trainer/attendance.html">Attendance</a>
      <a href="../trainer/applications.html" class="active" aria-current="page">Applications</a>
    </nav>
    <div class="header-tools">
      <label for="role-switch" class="visually-hidden">Switch role</label>
      <select id="role-switch" class="form-select role-select" onchange="location.href = this.value">
        <option value="../participant/trainings.html">Participant</option>
        <option value="../trainer/my-trainings.html" selected>Trainer</option>
        <option value="../manager/requests.html">Manager</option>
        <option value="../admin/dashboard.html">Admin</option>
      </select>
      <a href="../alerts.html" class="bell" aria-label="Alerts">&#128276;<i></i></a>
      <a href="../profile.html" class="user-chip"><span class="avatar">TB</span><span>TechBridge Institute</span></a>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <p class="eyebrow">Trainer</p>
      <h1>Review applications</h1>
      <p class="muted">Accept, waitlist or decline each applicant.</p>
    </div>

    <div class="table-wrap">
      <table class="table mb-0 align-middle">
        <thead>
          <tr><th>Applicant</th><th>Training</th><th>Motivation</th><th>Status</th><th class="text-end">Action</th></tr>
        </thead>
        <tbody id="apps-body"></tbody>
      </table>
    </div>
  </main>

  <!-- Footer (same layout as the homepage) -->
  <footer class="site-footer">
    <div class="footer-brand">
      <a href="../index.html" class="brand">
        <img src="../assets/img/logo.png" alt="Levent" class="brand-logo">
      </a>
      <p>LEARN · CONNECT · GROW</p>
    </div>
    <p>&copy; 2026 Training Events. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var apps = [
      { name: "Adam",  training: "Web Development Fundamentals", fee: 150, note: "Final-year AI student who wants to strengthen web skills.", status: "Under review" },
      { name: "Elisa", training: "UI/UX Design Basics",          fee: 50,  note: "Interested in interface layouts and wireframing.",        status: "Under review" },
      { name: "Huda",  training: "Public Speaking Skills",       fee: 0,   note: "Wants to improve presentation skills.",                   status: "Under review" }
    ];
    var tagOf = { "Under review": "", "Accepted": "ok", "Declined": "bad", "Waitlisted": "warn" };

    function render() {
      document.getElementById("apps-body").innerHTML = apps.map(function (a, i) {
        var next = a.status === "Accepted" ? '<div class="muted small">' + (a.fee > 0 ? "Awaiting payment" : "Enrolled") + '</div>' : "";
        var reason = a.reason ? '<div class="muted small">' + a.reason + '</div>' : "";
        var buttons = a.status === "Under review"
          ? '<button class="btn btn-primary btn-sm me-1" onclick="decide(' + i + ',\'Accepted\')">Accept</button>' +
            '<button class="btn btn-soft btn-sm me-1" onclick="decide(' + i + ',\'Waitlisted\')">Waitlist</button>' +
            '<button class="btn btn-soft btn-sm" onclick="decide(' + i + ',\'Declined\')">Decline</button>'
          : '<span class="muted small">Reviewed</span>';
        return '<tr><td class="fw-semibold">' + a.name + '</td><td>' + a.training + '</td>' +
               '<td class="muted small" style="max-width:280px">' + a.note + '</td>' +
               '<td><span class="tag ' + tagOf[a.status] + '">' + a.status + '</span>' + next + reason + '</td>' +
               '<td class="text-end">' + buttons + '</td></tr>';
      }).join("");
    }

    function decide(i, status) {
      if (status === "Declined") {
        var reason = prompt("Reason for declining (required):");
        if (!reason || !reason.trim()) return;
        apps[i].reason = reason.trim();
      }
      apps[i].status = status;
      render();
    }

    render();
  </script>
</body>
</html>
