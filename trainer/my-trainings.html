<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My trainings · Training Events</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-role="trainer" data-page="my-trainings">
<div id="site-header"></div>
<main class="container">
<div class="page-head cols" style="align-items:flex-end"><div><p class="eyebrow">Trainer</p><h1>My trainings</h1><p class="muted">Your requests and published trainings.</p></div>
<div style="flex:0 0 auto"><a class="btn btn-primary" href="new-request.html">New request</a></div></div>
<div class="grid-4"><div class="stat"><span>Waiting for the manager</span><strong id="c-pending">0</strong></div><div class="stat"><span>Published</span><strong id="c-published">0</strong></div>
<div class="stat"><span>Finished or closed</span><strong id="c-done">0</strong></div><div class="stat"><span>All trainings</span><strong id="c-all">0</strong></div></div>
<div class="tabs" id="status-tabs" aria-label="Filter by status"><button class="active" data-f="all">All</button><button data-f="pending">Waiting</button><button data-f="published">Published</button><button data-f="done">Finished</button></div>
<div class="table-wrap"><table class="table align-middle mb-0"><thead><tr><th>Training</th><th>Dates</th><th class="num">Seats</th><th>Fee</th><th>Status</th><th>Actions</th></tr></thead><tbody id="my-rows"></tbody></table></div>
</main>
<div id="site-footer"></div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/scheduling.js"></script>
<script src="../assets/js/requests.js"></script>
</body>
</html>
