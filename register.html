
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Levent</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Shared stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body class="auth-page">

    <main class="auth-layout">

        <!-- Levent Logo -->
        <a href="index.html" class="auth-logo">
            <img
                src="assets/img/logo-2.png"
                alt="Levent - Learn, Connect, Grow"
            >
        </a>


        <!-- Registration Card -->
        <section class="auth-card">

            <div class="auth-card-header">

                <p class="auth-eyebrow">GET STARTED</p>

                <h1>Create your account</h1>

                <p>
                    Join Levent and discover new opportunities.
                </p>

            </div>


            <!-- Social Registration -->
            <div class="social-login">

                <button type="button" class="social-button">
                    <span class="google-mark">G</span>
                    Google
                </button>

                <button type="button" class="social-button">
                    <span class="facebook-mark">f</span>
                    Facebook
                </button>

                <button type="button" class="social-button">
                    <span class="microsoft-mark" aria-hidden="true">
                        <i></i><i></i><i></i><i></i>
                    </span>
                    Microsoft
                </button>

            </div>


            <!-- Divider -->
            <div class="auth-divider">
                <span>OR REGISTER WITH EMAIL</span>
            </div>


            <!-- Registration Fields -->
            <div class="auth-fields">

                <div class="auth-field">

                    <label for="register-name">
                        Full name
                    </label>

                    <input
                        type="text"
                        id="register-name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="register-email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="register-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="confirm-password">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button type="button" class="auth-submit">
                    Create account
                </button>

            </div>


            <!-- Login Link -->
            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </section>


        <p class="auth-legal">
            Learn. Connect. Grow.
        </p>

    </main>

</body>
</html>
